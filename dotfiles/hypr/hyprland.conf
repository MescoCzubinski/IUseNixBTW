################
### MONITORS ###
################

monitor=eDP-1,1920x1080@60,0x0,1

###################
### MY PROGRAMS ###
###################

$terminal = kitty -o include="~/.config/kitty/kitty-themes/themes/Dracula.conf"
$fileManager = kitty -e superfile
$editor = code
$browser = brave
$menu = rofi -show drun

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
}

#####################
### LOOK AND FEEL ###
#####################

general {
    no_border_on_floating = true

    gaps_in = 4
    gaps_out = 8

    border_size = 0

    col.active_border = rgb(FF90BC) rgb(5FBDFF) 45deg
    col.inactive_border = rgba(00000000)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 15
    rounding_power = 2

    active_opacity = 0.93
    inactive_opacity = 0.87

    shadow {
        enabled = false
        range = 8
        render_power = 4
        color = rgba(00000033)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
	      new_optimizations = true
        ignore_opacity = false
        vibrancy = 0.25
    }
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.1

    animation = windows, 1, 3, myBezier
    animation = windowsMove, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = workspaces, 1, 5, overshot, slide

    animation = border, 1, 10, default
    animation = fade, 1, 5, default

}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, Escape, exec, hyprctl dispatch exit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, $menu
bind = $mainMod, C, exec, $editor
bind = $mainMod, X, exec, $browser
# bind = $mainMod, V, togglefloating,
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

bind=$mainMod SHIFT, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind=$mainMod, F, exec, firefox
bind=ALT, Print,  exec, grim - | wl-copy
bind=$mainMod, C, exec, code
bind=$mainMod SHIFT, S, exec, $HOME/.config/hypr/Scripts/screenshot.sh
bind=$mainMod, W, exec, netease-cloud-music-gtk4
bind=$mainMod SHIFT, C, exec, code
bind=$mainMod, O, exec, obs

# move focus with mainMod
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod ALT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Zrzut ekranu zaznaczonego fragmentu do schowka
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = workspace 1 silent, class:^(Spotify)$
windowrulev2 = workspace 1 silent, class:^(discord)$
windowrulev2 = workspace 2, class:^(Brave-browser)$
windowrulev2 = workspace 3 silent, class:^(code-url-handler)$
windowrulev2 = workspace 3 silent, class:^(VSCode)$

#####################
### NEW CONFIGURA ###
#####################

env = QT_QPA_PLATFORMTHEME,qt5ct

exec-once=waybar & hyprpaper & hypridle
exec-once=mako
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=udiskie &amp;
exec-once=fcitx5 --replace -d
exec-once=hypridle
exec-once=copyq --start-server
exec-once=redshift -c ~/.config/redshift/redshift.conf
exec-once=clash-verge
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = xsetroot -cursor_name left_ptr
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
