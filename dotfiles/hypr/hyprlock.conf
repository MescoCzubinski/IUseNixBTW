# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 7
    brightness = 0.5
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

label {
    monitor =
    text = $TIME
    color = rgba(216, 222, 233, 0.80)
    font_size = 90
    font_family = FiraCode Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text =  $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 20
    font_family = FiraCode Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = FiraCode Nerd Font
    placeholder_text = Enter password...
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}
