# Font settings
font_family             FiraCode Nerd Font
bold_font               auto
italic_font             auto
bold_italic_font        auto
font_size               10.0

# Features
font_features FiraCode-Regular +cv02 +ss08 +ss02 +ss03 +ss04 +ss05
font_features FiraCode-Bold    +cv02 +ss08 +ss02 +ss03 +ss04 +ss05
font_features FiraCode-Retina  +cv02 +ss08 +ss02 +ss03 +ss04 +ss05

# Window settings
background_opacity      0.8
window_padding_width    6 14
hide_window_decorations yes
confirm_os_window_close 0

# Cursor
cursor_shape            beam
cursor_beam_thickness   1.6
cursor_blink_interval   0.5

# Tab bar
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_bar_background      none
tab_bar_margin_height   0.0 5.0
tab_title_template      "{'Terminal' if tab.active_exe in ('fish', 'bash', 'sh', 'zsh') else tab.active_exe.capitalize()}"
active_tab_foreground   #000000
active_tab_background   #ffffff
inactive_tab_foreground #c8c8cc
inactive_tab_background #3c3c3c

# Key mapping
map ctrl+backspace   send_text all \x17
map ctrl+delete      send_text all \x1bd

# Browser-style tabs
map ctrl+t           new_tab_with_cwd
map ctrl+w           close_tab
map ctrl+1           goto_tab 1
map ctrl+2           goto_tab 2
map ctrl+3           goto_tab 3
map ctrl+4           goto_tab 4
map ctrl+5           goto_tab 5
map ctrl+6           goto_tab 6
map ctrl+7           goto_tab 7
map ctrl+8           goto_tab 8
map ctrl+9           goto_tab 9

# Prompt navigation (kitty shell integration)
map ctrl+alt+p        scroll_to_prompt -1
map ctrl+alt+n        scroll_to_prompt 1

# Colors
foreground              #ffffff
background              #101010
selection_foreground    #000000
selection_background    #ffffff

cursor                  #ffffff
cursor_text_color       #000000

# Black
color0  #1c1c1e
color8  #3c3c3c

# Red
color1  #ff5a5f
color9  #ff5a5f

# Green
color2  #83c1a6
color10 #83c1a6

# Yellow
color3  #d4a57c
color11 #e8b98c

# Blue
color4  #087e8b
color12 #087e8b

# Magenta
color5  #b47db0
color13 #c48fc0

# Cyan
color6  #5ab4c8
color14 #6bbcce

# White
