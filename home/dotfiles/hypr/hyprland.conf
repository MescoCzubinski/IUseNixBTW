# Monitors
monitor = HDMI-A-1, 3840x2160@30, -2560x0, 1.5
monitor = DP-1, 3840x2160@60, 0x0, 1.5
monitor = eDP-1, 1920x1080@60, 3200x0, 1

# My programs
$terminal = kitty
$fileManager = yazi
$editor = codium
$browser = brave
$menu = vicinae toggle

# Look and feel
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 0
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 20

    active_opacity = 0.975
    inactive_opacity = 0.8

    shadow {
        enabled = false
        range = 8
        render_power = 4
        color = rgba(00000033)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
        ignore_opacity = false
        vibrancy = 0.25
    }
}

animations {
    enabled = yes

    bezier = snappy, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = easeInOut, 0.42, 0, 0.58, 1

    animation = windows, 1, 4, snappy
    animation = windowsMove, 1, 4, snappy
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, easeInOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 1
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

binds {
    allow_workspace_cycles = yes
    scroll_event_delay = 300
}

ecosystem {
    no_update_news = true
}

xwayland {
    force_zero_scaling = true
}

# Input
input {
    kb_layout = pl
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        drag_3fg = true
    }
}

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# Keybindings
$mainMod = SUPER

bindr = $mainMod, Super_L, exec, $menu
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, Escape, exec, hyprctl dispatch exit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, D, exec, discord
bind = $mainMod, N, exec, obsidian
bind = $mainMod, C, exec, $editor
bind = $mainMod, B, exec, $browser

bind = alt, tab, cyclenext,
bind = $mainMod, tab, cyclenext,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, T, togglefloating

bind = $mainMod, alt, togglespecialworkspace, magic
bind = $mainMod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mainMod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mainMod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mainMod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mainMod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mainMod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mainMod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mainMod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mainMod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mainMod, 0, focusworkspaceoncurrentmonitor, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, space, exec, playerctl play-pause

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod ctrl, mouse:272, resizewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bind = , Print, exec, hyprshot -m region --clipboard-only
bind = $mainMod SHIFT, s, exec, hyprshot -m region --clipboard-only

# Environment variables
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,Adwaita-dark
env = COLOR_SCHEME,prefer-dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# Exec on start
exec-once = waybar
exec-once = hypridle
exec-once = hyprpaper
exec-once = vicinae server
exec-once = udiskie &
exec-once = swaync &

exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = xsetroot -cursor_name left_ptr

exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

exec-once = batsignal -w 20 -c 10 -d 5 -f 95 -W 'Battery low' -C 'Battery critical!' -D 'Battery very low!' -F 'Battery full'
